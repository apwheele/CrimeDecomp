<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crime decomposition explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">CRIME DECOMPOSITION</p>
      <h1>Monthly trend explorer</h1>
      <p class="lede">Inspect the global spline, agency departures, and monthly residual flags. Data are generated by the R model in this repository.</p>
    </header>
    <section class="controls" aria-label="Filters">
      <label>Crime type<select id="crime"></select></label>
      <label>Agency / city<select id="agency"></select></label>
      <label>Start date<input id="start" type="date"></label>
      <label>End date<input id="end" type="date"></label>
      <label>Residual threshold<input id="threshold" type="number" min="0" step="0.5" value="3"></label>
      <button id="reset" type="button">Reset filters</button>
    </section>
    <p id="status" class="status">Loading model outputs...</p>
    <section class="card"><div id="global-chart" class="chart" aria-label="Global and agency rates"></div></section>
    <section class="card"><div id="residual-chart" class="chart" aria-label="Pearson residuals"></div></section>
    <section class="card">
      <h2>Flagged months</h2>
      <div class="table-wrap"><table id="outliers"><thead><tr><th>Date</th><th>Agency</th><th>Crime</th><th>Observed rate</th><th>Fitted rate</th><th>Residual</th></tr></thead><tbody></tbody></table></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
